name: "🐛 Reportar um Bug / Report a Bug"
description: "Crie um relatório para nos ajudar a melhorar o Poke-README"
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Por favor, preencha as informações abaixo para nos ajudar a identificar o erro.
  - type: textarea
    id: description
    attributes:
      label: "Descrição do Bug"
      description: "Uma descrição clara e concisa do que o bug é."
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: "URL da API com erro"
      description: "Exemplo: https://pokereadme.murilonoguez.com.br/api?user=MuriloNoguez&pokes=1,4,7"
  - type: textarea
    id: steps
    attributes:
      label: "Passos para Reproduzir"
      description: "Liste os passos para que possamos ver o erro acontecer."
      placeholder: |
        1. Vá para '...'
        2. Clique em '....'
        3. Veja o erro
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Comportamento Esperado"
      description: "O que você esperava que acontecesse?"
  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots / Imagens"
      description: "Se possível, adicione imagens do erro."
