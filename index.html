<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poke-README Builder</title>
  <meta name="description" content="Build an animated Pokémon team for your GitHub profile README. It evolves with your commits.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@400;500;600;700&family=Red+Hat+Mono:wght@400;500;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></symbol>
    <symbol id="i-up" viewBox="0 0 16 16"><path d="M8 13V3M4 7l4-4 4 4"/></symbol>
    <symbol id="i-down" viewBox="0 0 16 16"><path d="M8 3v10M4 9l4 4 4-4"/></symbol>
    <symbol id="i-copy" viewBox="0 0 16 16"><path d="M5.5 5.5h7v7h-7zM3.5 10.5v-7h7"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7"/></symbol>
    <symbol id="i-reset" viewBox="0 0 16 16"><path d="M3 8a5 5 0 1 0 1.5-3.5M3 2.5v3h3"/></symbol>
  </svg>

  <div class="app">
    <header class="band">
      <a class="wordmark" href="https://github.com/MuriloNoguez/Poke-README">Poke-README</a>

      <div class="band-field step" data-step="1">
        <label for="username"><span class="step-mark" aria-hidden="true">1</span><span data-i18n="trainer"></span></label>
        <div class="input-wrap">
          <span class="input-prefix" aria-hidden="true">github.com/</span>
          <input type="text" id="username" autocomplete="off" spellcheck="false" autocapitalize="off" data-i18n-placeholder="usernamePh">
        </div>
        <p class="field-status" id="user-status" aria-live="polite"></p>
      </div>

      <div class="band-field scrubber">
        <div class="scrub-head">
          <label for="commits" data-i18n="commits"></label>
          <output id="commit-readout" for="commits" class="readout">0</output>
          <button type="button" class="btn-ghost" id="reset-commits" hidden>
            <svg class="icon" aria-hidden="true"><use href="#i-reset"/></svg><span data-i18n="useMine"></span>
          </button>
        </div>
        <input type="range" id="commits" min="0" max="1200" step="10" value="0">
        <p class="field-hint" data-i18n="scrubHint"></p>
      </div>

      <div class="band-field lang">
        <label for="lang" data-i18n="language"></label>
        <select id="lang"></select>
      </div>
    </header>

    <main class="dex step" data-step="2" aria-labelledby="dex-title">
      <div class="dex-head">
        <h1 id="dex-title"><span class="step-mark" aria-hidden="true">2</span><span data-i18n="pickTitle"></span></h1>
        <input type="search" id="search" class="search" autocomplete="off" data-i18n-placeholder="searchPh" data-i18n-aria="searchPh">
      </div>

      <p class="field-hint dex-hint" data-i18n="pickHint"></p>

      <div class="filters">
        <div class="filter">
          <span class="filter-label" data-i18n="generation"></span>
          <div class="seg" role="group" id="gen-filter" data-i18n-aria="generation"></div>
        </div>
        <div class="filter">
          <span class="filter-label" data-i18n="category"></span>
          <div class="seg" role="group" id="cat-filter" data-i18n-aria="category"></div>
        </div>
        <div class="filter filter-types">
          <span class="filter-label" data-i18n="type"></span>
          <div class="chips" role="group" id="type-filter" data-i18n-aria="type"></div>
        </div>
      </div>

      <div class="dex-meta">
        <p id="result-count" aria-live="polite"></p>
        <button type="button" class="btn-link" data-action="clear-filters" hidden data-i18n="clearFilters"></button>
        <div class="legend" aria-hidden="true">
          <span data-i18n="legendFar"></span>
          <i class="l0"></i><i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i>
          <span data-i18n="legendNear"></span>
        </div>
      </div>

      <div class="grid-scroll">
        <div id="grid"></div>
        <div class="empty" id="grid-empty" hidden>
          <p data-i18n="noResults"></p>
          <button type="button" class="btn-ghost" data-action="clear-filters" data-i18n="clearFilters"></button>
        </div>
      </div>
    </main>

    <aside class="rail">
      <section class="preview" aria-labelledby="preview-title">
        <h2 id="preview-title" class="visually-hidden" data-i18n="preview"></h2>
        <div class="preview-frame">
          <p class="preview-empty" id="preview-empty" data-i18n="previewEmpty"></p>
          <img id="preview-img" alt="" hidden>
        </div>
        <p class="field-hint" data-i18n="previewNote"></p>
        <h3 class="sub-head" data-i18n="background"></h3>
        <div class="bg-grid" id="bg-picker" role="group" data-i18n-aria="background"></div>
      </section>

      <section class="team step" data-step="2" aria-labelledby="team-title">
        <div class="rail-head">
          <h2 id="team-title" data-i18n="team"></h2>
          <span class="mono" id="team-count">0/6</span>
        </div>
        <ol class="log" id="team-list"></ol>
        <p class="team-msg" id="team-msg" aria-live="polite"></p>
        <div class="eevee" id="eevee-field" hidden>
          <label for="eevee-item" data-i18n="eeveeItem"></label>
          <select id="eevee-item"></select>
        </div>
      </section>

      <section class="code step" data-step="3" aria-labelledby="code-title">
        <div class="rail-head">
          <h2 id="code-title"><span class="step-mark" aria-hidden="true">3</span><span data-i18n="copyTitle"></span></h2>
          <div class="tabs" role="tablist" id="format-tabs" data-i18n-aria="format">
            <button type="button" role="tab" data-format="md" aria-selected="true">Markdown</button>
            <button type="button" role="tab" data-format="html" aria-selected="false">HTML</button>
            <button type="button" role="tab" data-format="url" aria-selected="false">URL</button>
          </div>
        </div>
        <pre class="code-box"><code id="output-code"></code></pre>
        <button type="button" class="btn-primary" id="copy-btn" disabled>
          <svg class="icon" aria-hidden="true"><use href="#i-copy"/></svg><span id="copy-label" data-i18n="copy"></span>
        </button>
      </section>

      <footer class="legal">
        <p data-i18n="legal"></p>
      </footer>
    </aside>
  </div>

  <a class="jump" id="jump" href="#code-title" hidden>
    <span class="mono" id="jump-count">0/6</span><span data-i18n="copyTitle"></span>
    <svg class="icon" aria-hidden="true"><use href="#i-down"/></svg>
  </a>

  <script src="script.js"></script>
</body>
</html>
