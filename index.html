<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poke-README Builder</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar card">
            <div class="sidebar-header">
                <h2>Settings</h2>
                <button id="clear-btn" class="btn-icon" title="Clear Team">🗑️</button>
            </div>

            <div class="config-section">
                <label>GitHub Username</label>
                <input type="text" id="username" placeholder="Type username..." autocomplete="off">
            </div>

            <div class="config-section" id="nicknames-section">
                <label>Team Nicknames</label>
                <div id="nicknames-container" class="nicknames-list">
                    <!-- Name inputs will be injected here -->
                </div>
            </div>

            <div class="config-section">
                <label>Search Pokémon</label>
                <input type="text" id="search" placeholder="Name or No...">
            </div>

            <div class="pokemon-list-container">
                <div class="pokemon-list" id="grid">
                    <!-- Cards will be injected here -->
                </div>
            </div>

            <div class="selection-counter">
                <span>Selected: <strong id="count">0</strong>/6</span>
            </div>
        </aside>

        <!-- Main Content (Preview Area) -->
        <main class="main-content">
            <header class="main-header">
                <h1>Poké-README <span>Live Preview</span></h1>
                <p>See how your team will look on your profile!</p>
            </header>

            <div class="preview-card card">
                <div class="preview-container" id="preview-wrapper">
                    <div class="preview-placeholder">Select a Pokémon and type a username for preview...</div>
                    <img id="preview-img" src="" alt="Preview" style="display: none;">
                </div>
            </div>

            <section class="code-section">
                <div class="code-header">
                    <h3>Markdown Code</h3>
                    <button id="copy-btn" class="btn-primary">Copy Code</button>
                </div>
                <div class="code-box">
                    <pre><code id="output-code">Select Pokémon to generate code...</code></pre>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
